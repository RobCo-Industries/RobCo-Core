name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/robco-industries/robco-ci

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          tag=$(ci/image-tag.sh)
          pinned=$(tr -d '[:space:]' < ci/IMAGE_TAG)
          if [ "$tag" != "$pinned" ]; then
            echo "::error file=ci/IMAGE_TAG::ci/IMAGE_TAG is '$pinned' but ci/Dockerfile hashes to '$tag'. Run: ci/image-tag.sh > ci/IMAGE_TAG"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:$tag" >> "$GITHUB_OUTPUT"

      - name: Detect fork pull request
        id: fork
        run: echo "fork=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: steps.fork.outputs.fork != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build only (fork pull request)
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile
          push: false
          cache-from: type=gha

      - name: Fail when a fork needs a new image
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork == 'true'
        run: |
          echo "::error::${{ steps.tag.outputs.image }} does not exist and fork pull requests cannot push it. The image builds, but a maintainer must push it from a branch in this repository."
          exit 1

      - name: Tag latest on main
        if: steps.exists.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t "${IMAGE_NAME}:latest" "${{ steps.tag.outputs.image }}"

  canary:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Canary tests
        run: make venv && make test-canary
