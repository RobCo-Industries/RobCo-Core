name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/robco-industries/robco-ci

jobs:
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the workflows
        run: make check-workflows

  image:
    # The guard passes first: this job can write packages, so no step of
    # it runs while a workflow line is unchecked.
    needs: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image tag
        id: tag
        run: |
          tag=$(ci/image-tag.sh)
          pinned=$(tr -d '[:space:]' < ci/IMAGE_TAG)
          if [ "$tag" != "$pinned" ]; then
            echo "::error file=ci/IMAGE_TAG::ci/IMAGE_TAG is '$pinned' but ci/Dockerfile hashes to '$tag'. Run: ci/image-tag.sh > ci/IMAGE_TAG"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:$tag" >> "$GITHUB_OUTPUT"

      - name: Detect fork pull request
        id: fork
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "fork=$IS_FORK" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: steps.fork.outputs.fork != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image exists
        id: exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: List the image tags
        id: tags
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          REF: ${{ github.ref }}
        run: |
          tags="$IMAGE"
          if [ "$REF" = refs/heads/main ]; then
            tags="$tags,${IMAGE_NAME}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build only (fork pull request)
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci
          file: ci/Dockerfile
          push: false
          cache-from: type=gha

      - name: Fail when a fork needs a new image
        if: steps.exists.outputs.exists != 'true' && steps.fork.outputs.fork == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          echo "::error::$IMAGE does not exist and fork pull requests cannot push it. The image builds, but a maintainer must push it from a branch in this repository."
          exit 1

      - name: Tag latest on main
        if: steps.exists.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: docker buildx imagetools create -t "${IMAGE_NAME}:latest" "$IMAGE"

  host:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host unit tests
        run: make test-host HOST_SANITIZE=require

  canary:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Canary tests
        run: make venv && make test-canary

  test:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Spikes, examples and target tests
        run: make venv && make test-tools test-docs test-spikes test-examples test-target
