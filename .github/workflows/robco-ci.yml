# Reusable CI workflow for the RobCo bare-metal repos.
#
# Inputs:
#   image-tag     (required) robco-ci content tag to run in. Read it from
#                 ci/IMAGE_TAG in the RobCo-Core submodule.
#   make-targets  make targets for the build job. Default: "all".
#   test-targets  make targets for the test job, run once per board.
#                 Empty skips the test job. Default: "".
#   boards        JSON array of QEMU boards passed as BOARD=<board>.
#                 Default: '["raspi0","raspi2b"]'.
#   artifact-path path uploaded as the "build" artifact after the build.
#                 Empty skips the upload. Default: "".
#
# Both jobs run "make CI=1 ...". The robco-ci package must be readable
# by the calling repository.
#
# Git in the container: both jobs run as root on a checkout owned by
# the runner user, so git refuses it. A step after the checkout marks
# the top folder and every submodule folder, at any depth, as a git
# safe.directory, then runs git rev-parse HEAD in each folder that has
# a .git entry. The job fails if git still refuses one. The step is
# inline because a script in RobCo-Core sits at a different submodule
# path in each caller.
#
# Pinning: call this workflow at the full commit hash your RobCo-Core
# submodule points at, never @main, and pass the tag from ci/IMAGE_TAG
# at that commit. Both are literals, so they drift when the submodule
# moves. tools/check_pins.sh compares them, without needing git:
#
#   external/robco-core/tools/check_pins.sh .github/workflows/ci.yml
#
# It checks every job that calls this workflow: each one needs the commit
# in its uses: line and the tag in its own with: image-tag. It needs
# python3 and no YAML library. It reads block mappings and a with: flow
# mapping on one line. On other YAML there, such as anchors or a flow
# mapping over several lines, it stops and names the line.
#
# Permissions: the caller must grant contents: read and packages: read,
# at the workflow or job level.
#
# Example, with the submodule in external/robco-core:
#   permissions:
#     contents: read
#     packages: read
#   jobs:
#     ci:
#       uses: RobCo-Industries/RobCo-Core/.github/workflows/robco-ci.yml@<submodule commit, 40 hex digits>
#       with:
#         image-tag: <contents of external/robco-core/ci/IMAGE_TAG>
#         make-targets: all test-host
#         test-targets: test-target

name: robco-ci

on:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
      make-targets:
        type: string
        default: "all"
      test-targets:
        type: string
        default: ""
      boards:
        type: string
        default: '["raspi0","raspi2b"]'
      artifact-path:
        type: string
        default: ""

# The calling workflow must grant packages: read, and the robco-ci
# image package must be readable by the calling repository.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/robco-industries/robco-ci:${{ inputs.image-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The checkout belongs to the runner user and the container runs as
      # root, so git refuses it. Mark the top folder and each submodule
      # folder as safe, then run git in each folder that has a .git entry.
      - name: Mark the checkout safe for git
        shell: bash
        run: |
          top="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$top"
          find "$top" -name .gitmodules -type f | while IFS= read -r file; do
            base=$(dirname "$file")
            git config --file "$file" --get-regexp '^submodule\..*\.path$' |
              while read -r _ path; do
                git config --global --add safe.directory "$base/$path"
              done
          done
          find "$top" -name .git -prune | while IFS= read -r dotgit; do
            git -C "$(dirname "$dotgit")" rev-parse HEAD
          done
      - name: Build
        env:
          MAKE_TARGETS: ${{ inputs.make-targets }}
        run: make CI=1 $MAKE_TARGETS
      - name: Upload artifact
        if: inputs.artifact-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error

  test:
    if: inputs.test-targets != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.boards) }}
    container:
      image: ghcr.io/robco-industries/robco-ci:${{ inputs.image-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The checkout belongs to the runner user and the container runs as
      # root, so git refuses it. Mark the top folder and each submodule
      # folder as safe, then run git in each folder that has a .git entry.
      - name: Mark the checkout safe for git
        shell: bash
        run: |
          top="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$top"
          find "$top" -name .gitmodules -type f | while IFS= read -r file; do
            base=$(dirname "$file")
            git config --file "$file" --get-regexp '^submodule\..*\.path$' |
              while read -r _ path; do
                git config --global --add safe.directory "$base/$path"
              done
          done
          find "$top" -name .git -prune | while IFS= read -r dotgit; do
            git -C "$(dirname "$dotgit")" rev-parse HEAD
          done
      - name: Test on ${{ matrix.board }}
        env:
          TEST_TARGETS: ${{ inputs.test-targets }}
          BOARD: ${{ matrix.board }}
        run: make CI=1 $TEST_TARGETS BOARD="$BOARD"
